name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (optional)
        id: keystore
        env:
          NITTERIUM_KEYSTORE_BASE64: ${{ secrets.NITTERIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${NITTERIUM_KEYSTORE_BASE64:-}" ]; then
            echo "$NITTERIUM_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/nitterium-release.jks"
            echo "path=${RUNNER_TEMP}/nitterium-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed_with=upload" >> "$GITHUB_OUTPUT"
          else
            echo "signed_with=debug" >> "$GITHUB_OUTPUT"
            echo "No upload keystore secrets; release artifacts will be debug-signed."
          fi

      - name: Build release APK and AAB
        env:
          NITTERIUM_STORE_FILE: ${{ steps.keystore.outputs.path }}
          NITTERIUM_STORE_PASSWORD: ${{ secrets.NITTERIUM_STORE_PASSWORD }}
          NITTERIUM_KEY_ALIAS: ${{ secrets.NITTERIUM_KEY_ALIAS }}
          NITTERIUM_KEY_PASSWORD: ${{ secrets.NITTERIUM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect artifacts
        env:
          SIGNED_WITH: ${{ steps.keystore.outputs.signed_with }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)"
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" "dist/nitterium-${VERSION}-${SIGNED_WITH}.apk"
          cp "$AAB" "dist/nitterium-${VERSION}-${SIGNED_WITH}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
